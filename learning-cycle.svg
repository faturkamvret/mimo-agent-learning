<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1b26"/>
  <text x="400" y="35" text-anchor="middle" fill="#7aa2f7" font-size="20">Self-Improving Agent System</text>
  
  <!-- Circular learning loop -->
  <circle cx="400" cy="220" r="120" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="10,5"/>
  
  <rect x="320" y="80" width="160" height="50" rx="8" fill="#f7768e" opacity="0.2" stroke="#f7768e"/>
  <text x="400" y="105" text-anchor="middle" fill="#f7768e" font-size="12">Task Execution</text>
  <text x="400" y="120" text-anchor="middle" fill="#f7768e" font-size="10">Agent completes work</text>
  
  <rect x="560" y="170" width="160" height="50" rx="8" fill="#e0af68" opacity="0.2" stroke="#e0af68"/>
  <text x="640" y="195" text-anchor="middle" fill="#e0af68" font-size="12">Outcome Logging</text>
  <text x="640" y="210" text-anchor="middle" fill="#e0af68" font-size="10">Success/Failure metrics</text>
  
  <rect x="560" y="280" width="160" height="50" rx="8" fill="#9ece6a" opacity="0.2" stroke="#9ece6a"/>
  <text x="640" y="305" text-anchor="middle" fill="#9ece6a" font-size="12">MiMo Meta-Analysis</text>
  <text x="640" y="320" text-anchor="middle" fill="#9ece6a" font-size="10">Root cause identification</text>
  
  <rect x="240" y="280" width="160" height="50" rx="8" fill="#7aa2f7" opacity="0.2" stroke="#7aa2f7"/>
  <text x="320" y="305" text-anchor="middle" fill="#7aa2f7" font-size="12">Skill Update</text>
  <text x="320" y="320" text-anchor="middle" fill="#7aa2f7" font-size="10">Capability upgrade</text>
  
  <rect x="100" y="170" width="160" height="50" rx="8" fill="#bb9af7" opacity="0.2" stroke="#bb9af7"/>
  <text x="180" y="195" text-anchor="middle" fill="#bb9af7" font-size="12">Performance Review</text>
  <text x="180" y="210" text-anchor="middle" fill="#bb9af7" font-size="10">Accuracy improvement</text>
  
  <!-- Arrows -->
  <path d="M 480 105 Q 550 130 560 170" fill="none" stroke="#7aa2f7" stroke-width="2"/>
  <path d="M 640 220 L 640 280" fill="none" stroke="#7aa2f7" stroke-width="2"/>
  <path d="M 560 305 Q 480 330 400 330 Q 320 330 240 305" fill="none" stroke="#7aa2f7" stroke-width="2"/>
  <path d="M 240 295 Q 170 260 180 220" fill="none" stroke="#7aa2f7" stroke-width="2"/>
  <path d="M 180 170 Q 250 130 320 105" fill="none" stroke="#7aa2f7" stroke-width="2"/>
  
  <!-- Metrics -->
  <rect x="250" y="370" width="300" height="25" rx="4" fill="#3fb950" opacity="0.1" stroke="#3fb950"/>
  <text x="400" y="387" text-anchor="middle" fill="#3fb950" font-size="10">Accuracy improved 15% over 2 weeks through automated skill refinement</text>
</svg>